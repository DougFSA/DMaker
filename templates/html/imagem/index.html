<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!--
  Imagem animada: uma imagem do projeto que entra com slide, pop ou zoom e ganha um leve Ken Burns.
  Uma coisa só: sem fundo. A imagem vem de `dmaker.data.arquivo`, um arquivo que o DMaker serve só a esta composição.
  O movimento é feito para a imagem ficar nítida: o deslize anda em pixels inteiros do dispositivo (sem reamostrar) e
  não há `will-change`, que fixaria a resolução em que a imagem foi desenhada.
-->
<style>
  html, body { margin: 0; height: 100%; }
  .quadro { position: absolute; inset: 0; overflow: hidden; }
  .moldura { position: absolute; overflow: hidden; }
  .moldura img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; transform-origin: 50% 50%; }
  .com-sombra { filter: drop-shadow(0 0.6vmin 1.8vmin rgba(0, 0, 0, 0.38)); }
</style>
</head>
<body>
<div class="quadro" id="quadro"><div class="moldura" id="moldura"><img id="foto" alt=""></div></div>
<script>
  const d = dmaker.data;
  const W = dmaker.width, H = dmaker.height;
  const quadro = document.getElementById("quadro"), moldura = document.getElementById("moldura"), foto = document.getElementById("foto");
  const dpr = window.devicePixelRatio || 1;
  // posição em pixels inteiros do dispositivo: uma imagem em posição fracionária é reamostrada e perde nitidez
  const nitido = (px) => Math.round(px * dpr) / dpr;

  // a imagem carrega antes do primeiro quadro: o DMaker espera esta promessa
  window.dmakerReady = new Promise((resolve) => {
    foto.addEventListener("load", resolve, { once: true });
    foto.addEventListener("error", resolve, { once: true });
  });
  foto.src = d.arquivo;

  function encaixar() {
    const largura = foto.naturalWidth || W, altura = foto.naturalHeight || H;
    const k = d.ajuste === "cobrir" ? 1 : Math.min(W / largura, H / altura);
    // conter: a moldura tem a proporção da imagem, centrada; cobrir: a moldura é a página inteira (o excesso é cortado)
    const mw = d.ajuste === "cobrir" ? W : largura * k, mh = d.ajuste === "cobrir" ? H : altura * k;
    moldura.style.width = nitido(mw) + "px";
    moldura.style.height = nitido(mh) + "px";
    moldura.style.left = nitido((W - mw) / 2) + "px";
    moldura.style.top = nitido((H - mh) / 2) + "px";
    if (d.cantos) moldura.style.borderRadius = `min(var(--dm-radius), ${Math.min(mw, mh) / 2}px)`;
    if (d.sombra) quadro.classList.add("com-sombra");
  }
  foto.addEventListener("load", encaixar, { once: true });

  const suave = (p) => 1 - Math.pow(1 - p, 3);
  const vindoDe = { esquerda: [-1, 0], direita: [1, 0], cima: [0, -1], baixo: [0, 1] };

  window.dmakerSeek = (t) => {
    const p = Math.min(Math.max(t / d.duracao, 0), 1);
    const e = suave(p);
    let escala = 1, dx = 0, dy = 0, opacidade = 1;
    if (d.entrada === "slide") {
      const [sx, sy] = vindoDe[d.direcao] || vindoDe.esquerda;
      dx = sx * (1 - e) * W * 0.6;
      dy = sy * (1 - e) * H * 0.6;
      opacidade = Math.min(p * 3, 1);
    } else if (d.entrada === "pop") {
      escala = p >= 1 ? 1 : 0.5 + 0.5 * e + 0.12 * Math.sin(Math.PI * p) * (1 - p);
      opacidade = Math.min(p * 3, 1);
    } else {
      escala = 1.35 - 0.35 * e;
      opacidade = Math.min(p * 2, 1);
    }
    // Ken Burns: cresce devagar durante toda a composição, sem passar da duração (depois a imagem fica como está)
    const ken = 1 + d.ken_burns * Math.min(t / Math.max(dmaker.duration, 0.1), 1);
    const sai = Math.min(Math.max((dmaker.duration - t) / 0.3, 0), 1);
    moldura.style.transform = `translate(${nitido(dx)}px, ${nitido(dy)}px) scale(${escala})`;
    foto.style.transform = `scale(${ken})`;
    quadro.style.opacity = String(Math.min(opacidade, sai));
  };
</script>
</body>
</html>
