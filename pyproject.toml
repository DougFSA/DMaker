[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dmaker"
dynamic = ["version"]  # lida de dmaker.__version__ (veja [tool.setuptools.dynamic])
description = "Editor de vídeos curtos orientado a comandos: Instagram, Facebook, YouTube, TikTok e WhatsApp a partir de um spec JSON renderizado com FFmpeg."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "pillow>=10.2",
    "mcp>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",  # upload de referência de voz na interface (FastAPI Form/UploadFile)
    "numpy>=1.26",
    "jsonschema>=4.20",  # confere os argumentos do agente local e os exemplos do manual contra o esquema das ferramentas
]

[project.optional-dependencies]
# av: o faster-whisper abre o áudio com `metadata_errors`, parâmetro que o PyAV 16 removeu (TypeError ao transcrever)
captions = ["faster-whisper>=1.0", "av>=11,<16"]
# torch vem à parte, versão CPU: pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
# kokoro-onnx: motor rápido (vozes prontas); omnivoice: clones e vozes projetadas (lento na CPU);
# demucs: isolamento vocal (voz x música e ruído; usa só get_model e apply_model, sem o I/O do pacote)
# conversão de voz (OpenVoice V2): o código de inferência vem copiado em voice/third_party/openvoice, porque o
# pacote original fixa numpy, librosa e gradio antigos; ele só precisa do torch e do torchaudio já instalados
# sherpa-onnx: diarização (quem fala quando) na dublagem; audioseal: marca d'água inaudível (Meta, MIT) em toda fala sintetizada e a verificação (dmaker voice verify)
voice = ["kokoro-onnx>=0.6.1", "omnivoice>=0.2.1", "soundfile>=0.12", "num2words>=0.5", "demucs>=4.1", "sherpa-onnx>=1.13.8", "audioseal>=0.2"]
# lote: ler planilha .xlsx no `dmaker batch` (CSV e JSON não precisam de nada)
lote = ["openpyxl>=3.1"]
# agente: anexar arquivos PDF na conversa com o agente local (.txt, .md, .srt e .docx não precisam de nada)
agente = ["pypdf==6.20.1"]
# docs: exportar o manual em PDF (`dmaker manual export`) e tirar as capturas de tela, pelo Chromium do Playwright
# html: composição animada em HTML sobreposta ao vídeo (type "html"), pelo mesmo Chromium
# o Chromium baixa à parte, para dentro do clone (bin/playwright): dmaker setup --html
docs = ["playwright>=1.45"]
html = ["playwright>=1.45"]
# persona realista (uma foto e a fala viram um vídeo da pessoa falando, DMK-74): o ditto-talkinghead vendorizado em
# vendor/ditto roda o warp e o decoder no OpenVINO (GPU integrada Intel). O torch vem à parte (versão CPU, como acima)
# e `numpy<2.6` é o teto que o openvino exige. O openvino-telemetry NÃO entra: nada deve sair para a rede
# (instale o openvino com --no-deps se o pip insistir nele). Os modelos baixam à parte: dmaker models download persona-realista
persona-realista = ["openvino>=2026.4", "opencv-python-headless>=5.0", "numpy<2.6", "onnxruntime>=1.18", "scipy>=1.11", "librosa>=0.10"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
dmaker = "dmaker.cli:app"
dmaker-mcp = "dmaker.mcp_server:main"

[tool.setuptools.dynamic]
version = { attr = "dmaker.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dmaker = ["py.typed", "media/*.js", "ui/static/*", "ui/dist/*", "ui/dist/assets/*", "resources/*.md", "voice/third_party/*/LICENSE", "voice/third_party/*/ORIGEM.md", "vendor/ditto/LICENSE", "vendor/ditto/NOTICE", "vendor/ditto/default_kwargs.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not ditto'"
# ditto: roda o ditto de verdade (minutos, precisa dos modelos e de uma foto); fora do padrão: pytest -m ditto tests/test_ditto_real.py
markers = ["ditto: roda o ditto de verdade (minutos); fora do pytest padrão"]

[tool.ruff]
line-length = 110
target-version = "py311"
# código de terceiros copiado como está (veja o ORIGEM.md e o NOTICE de cada pasta): reformatar esconderia o que mudou
# em relação ao original, e o lint reprovaria o estilo deles (nomes de uma letra, imports fora de ordem)
extend-exclude = ["src/dmaker/voice/third_party", "src/dmaker/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
