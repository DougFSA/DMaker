[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dmaker"
version = "0.1.0"
description = "Editor de vídeos curtos orientado a comandos: Instagram, Facebook, YouTube, TikTok e WhatsApp a partir de um spec JSON renderizado com FFmpeg."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "pillow>=10.2",
    "mcp>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
]

[project.optional-dependencies]
captions = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
dmaker = "dmaker.cli:app"
dmaker-mcp = "dmaker.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dmaker = ["py.typed", "ui/static/*", "resources/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
