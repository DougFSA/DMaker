[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dmaker"
version = "0.1.0"
description = "Editor de vídeos curtos orientado a comandos: Instagram, Facebook, YouTube, TikTok e WhatsApp a partir de um spec JSON renderizado com FFmpeg."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "pillow>=10.2",
    "mcp>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",  # upload de referência de voz na interface (FastAPI Form/UploadFile)
    "numpy>=1.26",
]

[project.optional-dependencies]
captions = ["faster-whisper>=1.0"]
# torch vem à parte, versão CPU: pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
# kokoro-onnx: motor rápido (vozes prontas); omnivoice: clones e vozes projetadas (lento na CPU);
# demucs: isolamento vocal (voz x música e ruído; usa só get_model e apply_model, sem o I/O do pacote)
voice = ["kokoro-onnx>=0.6.1", "omnivoice>=0.2.1", "soundfile>=0.12", "num2words>=0.5", "demucs>=4.1", "sherpa-onnx>=1.13.8"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
dmaker = "dmaker.cli:app"
dmaker-mcp = "dmaker.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dmaker = ["py.typed", "ui/static/*", "resources/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
