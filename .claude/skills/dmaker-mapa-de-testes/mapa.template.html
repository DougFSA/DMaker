<title>Mapa de testes vVERSAO</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&family=Montserrat:wght@600&display=swap"

<!--
  DMAKER: template do mapa de testes (skill dmaker-mapa-de-testes).

  O visual mora aqui e NAO se reescreve a cada rodada: a skill so troca o bloco
  DADOS lá embaixo. Se o mapa da v9 e o da v12 parecerem paginas diferentes, o
  Douglas perde a leitura rapida que ele elogiou.

  As tres faces (Sora, Inter, Montserrat) vem do mapa de testes do MedlyCare:
  os dois projetos usam a mesma pagina, para a leitura rapida ser a mesma. O
  indigo e a cor do DMaker. O mapa e documento de trabalho do Douglas, nao um
  relatorio generico.
-->

<style>
  :root {
    --ground: #f6f6fa;
    --surface: #ffffff;
    --surface-sunk: #efeff6;
    --ink: #142229;
    --ink-soft: #56717c;
    --line: #dbe6e7;
    --line-strong: #c3d5d6;

    --teal: #4a49c4;
    --teal-soft: #e8e8f8;

    --amber: #9d6410;
    --amber-soft: #f9efdd;

    --done: #45735a;
    --done-soft: #e4efe7;

    --font-display: 'Sora', 'Segoe UI', system-ui, sans-serif;
    --font-body: 'Inter', 'Segoe UI', system-ui, sans-serif;
    --font-label: 'Montserrat', 'Segoe UI', system-ui, sans-serif;

    --radius: 12px;
    --shadow: 0 1px 2px rgba(20, 34, 41, 0.05), 0 6px 18px rgba(20, 34, 41, 0.05);
  }

  :root:not([data-theme='light']) { color-scheme: light; }

  /* Os tres estados de tema: claro no :root, escuro por preferencia do sistema
     (guardado contra a escolha explicita de claro) e escuro por escolha. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      color-scheme: dark;
      --ground: #0d181d;
      --surface: #14232a;
      --surface-sunk: #101d23;
      --ink: #e7f0f1;
      --ink-soft: #94aab2;
      --line: #23383f;
      --line-strong: #315058;
      --teal: #9a9bf0;
      --teal-soft: #1c1c3d;
      --amber: #dda75a;
      --amber-soft: #2e2411;
      --done: #7fb691;
      --done-soft: #16301e;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 18px rgba(0, 0, 0, 0.3);
    }
  }

  :root[data-theme='dark'] {
    color-scheme: dark;
    --ground: #0d181d;
    --surface: #14232a;
    --surface-sunk: #101d23;
    --ink: #e7f0f1;
    --ink-soft: #94aab2;
    --line: #23383f;
    --line-strong: #315058;
    --teal: #9a9bf0;
    --teal-soft: #1c1c3d;
    --amber: #dda75a;
    --amber-soft: #2e2411;
    --done: #7fb691;
    --done-soft: #16301e;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 18px rgba(0, 0, 0, 0.3);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 980px; margin: 0 auto; padding: 40px 20px 96px; }

  .eyebrow {
    font-family: var(--font-label);
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--teal);
    margin: 0 0 10px;
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(1.7rem, 4vw, 2.3rem);
    line-height: 1.15;
    letter-spacing: -0.02em;
    text-wrap: balance;
    margin: 0 0 14px;
  }

  .lede { max-width: 62ch; color: var(--ink-soft); margin: 0 0 28px; }
  .lede strong { color: var(--ink); font-weight: 600; }

  .placar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 0 30px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 34px;
  }

  .chip {
    display: inline-flex;
    align-items: baseline;
    gap: 7px;
    padding: 6px 13px;
    border-radius: 999px;
    background: var(--surface-sunk);
    border: 1px solid var(--line);
    font-size: 0.86rem;
    color: var(--ink-soft);
  }
  .chip b {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 0.98rem;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .chip-teal { background: var(--teal-soft); border-color: transparent; color: var(--teal); }
  .chip-teal b { color: var(--teal); }
  .chip-done { background: var(--done-soft); border-color: transparent; color: var(--done); }
  .chip-done b { color: var(--done); }

  .posto { margin-bottom: 46px; }

  .posto-topo {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 10px 14px;
    margin-bottom: 6px;
  }

  h2 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.32rem;
    letter-spacing: -0.01em;
    margin: 0;
  }

  .modo {
    font-family: var(--font-label);
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 9px;
    border-radius: 5px;
    background: var(--teal-soft);
    color: var(--teal);
  }
  .modo-avulso { background: var(--surface-sunk); color: var(--ink-soft); }
  .modo-pronto { background: var(--done-soft); color: var(--done); }

  .posto-nota { max-width: 66ch; color: var(--ink-soft); font-size: 0.94rem; margin: 0 0 16px; }

  .onde {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    margin-bottom: 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--teal);
    border-radius: 0 var(--radius) var(--radius) 0;
  }
  .onde-rot {
    font-family: var(--font-label);
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.86em;
    background: var(--surface-sunk);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 2px 7px;
    overflow-wrap: anywhere;
  }

  a { color: var(--teal); text-decoration-thickness: 1px; text-underline-offset: 2px; }
  a:hover { text-decoration-thickness: 2px; }
  a:focus-visible, input:focus-visible {
    outline: 2px solid var(--teal);
    outline-offset: 2px;
    border-radius: 3px;
  }

  .cards {
    list-style: none;
    margin: 0;
    padding: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .cards li + li { border-top: 1px solid var(--line); }

  .item {
    display: grid;
    grid-template-columns: 26px 88px 1fr;
    gap: 4px 14px;
    align-items: start;
    padding: 14px 18px;
    cursor: pointer;
  }
  @media (max-width: 620px) {
    .item { grid-template-columns: 26px 1fr; }
    .item .chave, .item .corpo { grid-column: 2; }
  }

  .item input {
    width: 17px;
    height: 17px;
    margin: 4px 0 0;
    accent-color: var(--teal);
    cursor: pointer;
  }

  .chave {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 0.9rem;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    padding-top: 1px;
  }
  .chave a { text-decoration: none; }
  .chave a:hover { text-decoration: underline; }

  .corpo { min-width: 0; }
  .titulo { font-weight: 500; }
  .olhar { font-size: 0.9rem; color: var(--ink-soft); margin-top: 2px; }

  .pr {
    display: inline-block;
    font-family: var(--font-label);
    font-size: 0.7rem;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    background: var(--surface-sunk);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 1px 7px;
    margin-left: 8px;
    vertical-align: 1px;
    font-variant-numeric: tabular-nums;
    text-decoration: none;
  }
  .pr:hover { color: var(--teal); border-color: var(--line-strong); }

  .item.marcado .titulo, .item.marcado .chave { color: var(--ink-soft); text-decoration: line-through; }
  .item.marcado .olhar { opacity: 0.6; }

  .selo {
    display: inline-block;
    font-family: var(--font-label);
    font-size: 0.66rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 4px;
    margin-left: 8px;
    background: var(--amber-soft);
    color: var(--amber);
    vertical-align: 2px;
  }

  .aviso {
    display: grid;
    grid-template-columns: 3px 1fr;
    gap: 0 16px;
    background: var(--amber-soft);
    border-radius: var(--radius);
    overflow: hidden;
    margin: 0 0 14px;
  }
  .aviso::before { content: ''; background: var(--amber); }
  .aviso-corpo { padding: 13px 16px 13px 0; }
  .aviso p { margin: 0; font-size: 0.93rem; }
  .aviso p + p { margin-top: 8px; }
  .aviso strong { color: var(--ink); }

  .fecho { margin-top: 46px; padding-top: 26px; border-top: 1px solid var(--line); }
  h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.02rem; margin: 0 0 12px; }
  .fecho ul { margin: 0; padding-left: 1.15em; max-width: 68ch; }
  .fecho li { margin-bottom: 9px; color: var(--ink-soft); font-size: 0.94rem; }
  .fecho li strong { color: var(--ink); font-weight: 600; }

  .assinatura { margin-top: 30px; font-size: 0.82rem; color: var(--ink-soft); }
</style>

<div class="wrap" id="raiz"></div>

<script>
  // ─────────────────────────────────────────────────────────────────────
  // A SKILL SUBSTITUI DAQUI ATE O FIM DO OBJETO DADOS. Nada mais.
  //
  // Formato de texto aceito em `nota`, `olhar`, `lede` e nos avisos:
  //   `código`   vira <code>
  //   *ênfase*   vira <em>
  //   **forte**  vira <strong>
  // Qualquer outro HTML e escapado: o conteudo vem de titulo de card e de
  // comentario do Jira, e dado nunca vira marcacao.
  // ─────────────────────────────────────────────────────────────────────
  const DADOS = {
    versao: '0',
    titulo: 'O que testar na develop',
    lede: 'Substituido pela skill.',
    placar: [],
    postos: [],
    avisos: [],
    notas: [],
    assinatura: '',
  };
  // ───────────────────────── fim do bloco DADOS ────────────────────────

  const JIRA = 'https://nativalabs.atlassian.net/browse/';
  const GH = 'https://github.com/DougFSA/DMaker/pull/';

  function escapar(t) {
    return String(t == null ? '' : t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // Escapa primeiro, marca depois: a ordem e o que impede um titulo de card
  // com "<" de virar tag.
  function rico(t) {
    return escapar(t)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g, '<em>$1</em>');
  }

  function el(tag, cls, html) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }

  function chipPr(numero, rotulo) {
    const a = el('a', 'pr', escapar(rotulo || '#' + numero));
    a.href = GH + numero;
    return a;
  }

  const raiz = document.getElementById('raiz');

  // ── Cabeçalho ──
  raiz.appendChild(el('p', 'eyebrow', 'DMaker · versão ' + escapar(DADOS.versao)));
  raiz.appendChild(el('h1', null, escapar(DADOS.titulo)));
  raiz.appendChild(el('p', 'lede', rico(DADOS.lede)));

  const placar = el('div', 'placar');
  DADOS.placar.forEach((c) => {
    const chip = el('span', 'chip' + (c.tom ? ' chip-' + c.tom : ''));
    const b = el('b', null, escapar(c.valor));
    if (c.id) b.id = c.id;
    chip.appendChild(b);
    chip.appendChild(document.createTextNode(' ' + (c.rotulo || '')));
    placar.appendChild(chip);
  });
  raiz.appendChild(placar);

  // ── Postos ──
  DADOS.postos.forEach((posto) => {
    const sec = el('section', 'posto');

    const topo = el('div', 'posto-topo');
    topo.appendChild(el('h2', null, escapar(posto.titulo)));
    if (posto.modo) {
      const cls = 'modo' + (posto.estilo && posto.estilo !== 'pilha' ? ' modo-' + posto.estilo : '');
      topo.appendChild(el('span', cls, escapar(posto.modo)));
    }
    sec.appendChild(topo);

    if (posto.nota) sec.appendChild(el('p', 'posto-nota', rico(posto.nota)));

    if (posto.onde) {
      const onde = el('div', 'onde');
      onde.appendChild(el('span', 'onde-rot', escapar(posto.onde.rotulo || 'Sente em')));
      onde.appendChild(el('code', null, escapar(posto.onde.branch)));
      if (posto.onde.pr) onde.appendChild(chipPr(posto.onde.pr, 'PR #' + posto.onde.pr));
      sec.appendChild(onde);
    }

    const lista = el('ul', 'cards');
    (posto.itens || []).forEach((it) => {
      const li = document.createElement('li');
      const label = el('label', 'item');

      const cx = document.createElement('input');
      cx.type = 'checkbox';
      cx.dataset.id = it.chave || it.id;
      cx.dataset.conta = it.contaComoTeste === false ? 'nao' : 'sim';
      label.appendChild(cx);

      const chave = el('span', 'chave');
      if (it.chave && /^DMK-\d+$/.test(it.chave)) {
        const a = document.createElement('a');
        a.href = JIRA + it.chave;
        a.textContent = it.chave;
        chave.appendChild(a);
      } else {
        chave.textContent = it.chave || '';
      }
      label.appendChild(chave);

      const corpo = el('span', 'corpo');
      const titulo = el('span', 'titulo', escapar(it.titulo));
      if (it.selo) titulo.appendChild(el('span', 'selo', escapar(it.selo)));
      if (it.pr) titulo.appendChild(chipPr(it.pr));
      corpo.appendChild(titulo);
      if (it.olhar) corpo.appendChild(el('span', 'olhar', rico(it.olhar)));
      label.appendChild(corpo);

      li.appendChild(label);
      lista.appendChild(li);
    });
    sec.appendChild(lista);

    raiz.appendChild(sec);
  });

  // ── Fecho ──
  if ((DADOS.avisos && DADOS.avisos.length) || (DADOS.notas && DADOS.notas.length)) {
    const fecho = el('div', 'fecho');
    fecho.appendChild(el('h3', null, escapar(DADOS.tituloFecho || 'Para lembrar')));

    if (DADOS.avisos && DADOS.avisos.length) {
      const box = el('div', 'aviso');
      const corpo = el('div', 'aviso-corpo');
      DADOS.avisos.forEach((a) => corpo.appendChild(el('p', null, rico(a))));
      box.appendChild(corpo);
      fecho.appendChild(box);
    }

    if (DADOS.notas && DADOS.notas.length) {
      const ul = document.createElement('ul');
      DADOS.notas.forEach((n) => ul.appendChild(el('li', null, rico(n))));
      fecho.appendChild(ul);
    }

    if (DADOS.assinatura) fecho.appendChild(el('p', 'assinatura', rico(DADOS.assinatura)));
    raiz.appendChild(fecho);
  }

  // ── Marcação, guardada no navegador de quem lê ──
  // try/catch nos dois lados: em janela anônima o acesso em si lança, não só
  // devolve vazio, e a página tem que continuar utilizável sem persistência.
  const CHAVE = 'dmaker:mapa-testes-v' + DADOS.versao;

  function ler() {
    try { return JSON.parse(localStorage.getItem(CHAVE) || '{}'); } catch (e) { return {}; }
  }
  function gravar(e2) {
    try { localStorage.setItem(CHAVE, JSON.stringify(e2)); } catch (e) { /* segue sem salvar */ }
  }

  const estado = ler();
  const caixas = Array.prototype.slice.call(document.querySelectorAll('.item input'));

  function pintar(c) {
    const item = c.closest('.item');
    if (item) item.classList.toggle('marcado', c.checked);
  }

  function contar() {
    const alvo = document.querySelector('#restam');
    if (!alvo) return;
    const testaveis = caixas.filter((c) => c.dataset.conta === 'sim');
    const feitos = testaveis.filter((c) => c.checked).length;
    alvo.textContent = String(testaveis.length - feitos);
  }

  caixas.forEach((c) => {
    c.checked = estado[c.dataset.id] === true;
    pintar(c);
    c.addEventListener('change', () => {
      estado[c.dataset.id] = c.checked;
      gravar(estado);
      pintar(c);
      contar();
    });
  });

  contar();
</script>
